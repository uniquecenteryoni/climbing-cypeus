        }

        body.safety-quiz-page {

            gap: 0;

        }

        .quiz-brand img {
            width: 150px;
            height: 86px;
            padding: 0;
            border-radius: 0;
            object-fit: contain;
            background: transparent;
        }

        .quiz-brand span {
            display: none;
        }

        .quiz-language {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            direction: ltr;
        }

        .quiz-language a {
            padding: 0.35rem 0.55rem;
            border: 1px solid #dfe7dc;
            border-radius: 999px;
            color: var(--quiz-green-light);
            font-size: 0.82rem;
            font-weight: 800;
            text-decoration: none;
        }

        .quiz-language a[aria-current="page"] {
            border-color: var(--quiz-green);
            background: var(--quiz-green);
            color: #fff;
        }

        .quiz-back-link {
            color: var(--quiz-green-light);
            font-weight: 700;
            text-decoration: none;
        }

        .quiz-hero {
            margin-bottom: 1.75rem;
            text-align: center;
        }

        .quiz-hero h1 {
            margin: 0 0 0.65rem;
            color: var(--quiz-green);
            font-size: clamp(2rem, 6vw, 3.3rem);
            line-height: 1.1;
        }

        .quiz-hero p {
            max-width: 600px;
            margin: 0 auto;
            color: var(--quiz-muted);
            font-size: 1.05rem;
            line-height: 1.7;
        }

        .quiz-card {
            overflow: hidden;
            border: 1px solid #dfe7dc;
            border-radius: 1.25rem;
            background: #fff;
            box-shadow: 0 18px 45px rgba(23, 61, 42, 0.1);
        }

            padding: 1.2rem 1.4rem 0;
        }

        .quiz-progress-line {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;

            color: var(--quiz-muted);
            font-size: 0.88rem;
            font-weight: 700;
        }

        .quiz-progress {
            height: 8px;
            overflow: hidden;
            border-radius: 999px;
            background: #e9efe5;
        }

        .quiz-progress-bar {
            width: 11.11%;
            height: 100%;
            border-radius: inherit;
            background: var(--quiz-lime);
            transition: width 220ms ease;
        }

        .quiz-question-panel {
            padding: 1.75rem 1.4rem 1.5rem;
        }

        .quiz-question-panel h2 {
            margin: 0 0 1.35rem;
            color: var(--quiz-green);
            font-size: clamp(1.35rem, 4vw, 1.85rem);
            line-height: 1.35;
        }

        .quiz-options {
            display: grid;
            gap: 0.75rem;
            margin: 0;
            padding: 0;
            border: 0;
        }

        .quiz-option {
            position: relative;
            display: flex;
            align-items: flex-start;
            gap: 0.7rem;
            padding: 0.9rem 1rem;
            border: 1px solid #dfe7dc;
            border-radius: 0.75rem;
            background: #fff;
            cursor: pointer;
            line-height: 1.5;
            transition: border-color 150ms ease, background 150ms ease, transform 150ms ease;
        }

        .quiz-option:hover,
        .quiz-option:has(input:focus-visible) {
            border-color: var(--quiz-lime);
            background: #fbfdf8;
        }

        .quiz-option:has(input:checked) {
            border-color: var(--quiz-green-light);
            background: #f1f7ea;
            transform: translateY(-1px);
        }

        .quiz-option input {
            flex: 0 0 auto;
            width: 1.1rem;
            height: 1.1rem;
            margin-top: 0.18rem;
            accent-color: var(--quiz-green-light);
        }

        .quiz-image {
            width: 100%;
            height: min(62vh, 620px);
            margin: 0 0 1.25rem;
            border-radius: 0.9rem;
            object-fit: contain;
            object-position: center;
            background: #e9efe5;
        }

        .quiz-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .quiz-error {
            min-height: 1.4em;
            color: #a34234;
            font-size: 0.9rem;
            font-weight: 700;
        }

        .quiz-submit,
        .quiz-restart {
            border: 0;
            border-radius: 999px;
            padding: 0.85rem 1.35rem;
            background: var(--quiz-green);
            color: #fff;
            cursor: pointer;
            font: inherit;
            font-weight: 800;
            transition: background 150ms ease, transform 150ms ease;
        }

        .quiz-submit:hover,
        .quiz-submit:focus-visible,
        .quiz-restart:hover,
        .quiz-restart:focus-visible {
            background: var(--quiz-green-light);
            transform: translateY(-1px);
        }

        .quiz-result {
            padding: 2.2rem 1.4rem 2.5rem;
            text-align: center;
        }

        .quiz-result[hidden] {
            display: none;
        }

        .quiz-result h2 {
            margin: 0 0 0.75rem;
            color: var(--quiz-green);
            font-size: 2rem;
        }

        .quiz-score {
            margin: 0 0 1rem;
            color: var(--quiz-green-light);
            font-size: 3.4rem;
            font-weight: 900;
            line-height: 1;
        }

        .quiz-result p {
            max-width: 520px;
            margin: 0 auto 1.5rem;
            color: var(--quiz-muted);
            line-height: 1.7;
        }

            display: grid;
            gap: 0.9rem;
            margin: 1.25rem 0;
        }

        .quiz-lead-fields label {
            display: grid;
            gap: 0.35rem;
            color: var(--quiz-green);
            font-weight: 800;
            text-align: right;
        }

            width: 100%;
            border: 1px solid #dfe7dc;
            border-radius: 0.65rem;
            padding: 0.8rem 0.9rem;
            background: #fff;
            color: var(--quiz-ink);
            font: inherit;
        }

        .quiz-interest-form {
            max-width: 560px;
            margin: 1.75rem auto 1rem;
            padding: 1.25rem;
            border-radius: 0.9rem;
            background: #f7f8f3;
            text-align: right;
        }

        .quiz-interest-form h3 {
            margin: 0 0 0.45rem;
            color: var(--quiz-green);
            font-size: 1.15rem;
        }

        .quiz-interest-options {
            display: grid;
            gap: 0.65rem;
            margin: 1rem 0;
        }

        .quiz-interest-options label {
            display: flex;
            align-items: flex-start;
            gap: 0.55rem;
            padding: 0.75rem;
            border: 1px solid #dfe7dc;
            border-radius: 0.65rem;
            background: #fff;
            cursor: pointer;
        }

        .quiz-interest-options input {
            margin-top: 0.2rem;
            accent-color: var(--quiz-green-light);
        }

        .quiz-send-status {
            min-height: 1.7em;
            color: var(--quiz-green-light) !important;
            font-weight: 700;
        }

        .quiz-interest-form .quiz-actions {
            margin-top: 1rem;
        }

            display: grid;
            justify-items: center;
            gap: 0.9rem;
            padding: 2.2rem 1.4rem 2.6rem;
            text-align: center;
        }

            width: min(100%, 340px);
            height: 230px;
            border-radius: 1rem;
            object-fit: cover;
            object-position: center;
            box-shadow: 0 12px 28px rgba(23, 61, 42, 0.16);
        }

        .quiz-complete-screen h2 {
            margin: 0;
            color: var(--quiz-green);
        }

        .quiz-complete-score {
            color: var(--quiz-green-light);
            font-size: 3.4rem;
            font-weight: 900;
            line-height: 1;
        }

        .quiz-complete-screen p {
            margin: 0;
            color: var(--quiz-muted);
            line-height: 1.6;
        }

        .quiz-complete-screen .quiz-complete-tagline {
            color: var(--quiz-green);
            font-size: 1.35rem;
            font-weight: 900;
        }

        .quiz-q9-note {
            margin: -0.55rem 0 1rem;
            color: var(--quiz-muted);
            font-size: 0.9rem;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        @media (max-width: 560px) {
            .quiz-shell {
                width: min(100% - 20px, 760px);
                padding-top: 0.75rem;
            }

            .quiz-topbar {
                margin-bottom: 1.25rem;
            }

            .quiz-brand img {
                width: 112px;
                height: 64px;
            }

            .quiz-question-panel,
            .quiz-result {
                padding-inline: 1rem;
            }

            .quiz-actions {
                align-items: flex-end;
                flex-direction: column-reverse;
            }

            .quiz-submit {
                width: 100%;
            }
        }
    </style>
</head>

                image: 'pics/safety-quiz-q8.webp', imageAlt: { he: 'מטפס מדגים מסלול חבל בין קוויק-דרואים', en: 'Climber demonstrating a rope path between quickdraws' },
                text: { he: 'מה בדרך כלל יוצר Z-clip?', en: 'What usually creates a Z-clip?' },
                options: { he: ['לקיחת חבל מתחת לקוויק-דרו הקודם', 'קליפ נמוך מדי', 'שימוש בקרבינר Wiregate', 'שימוש ברצועה ארוכה'], en: ['Taking rope from below the previous quickdraw', 'Clipping too low', 'Using a wiregate', 'Using a long sling'] }, answer: 0
            },
            {
                image: 'pics/safety-quiz-q9.webp', imageAlt: { he: 'מטפס על מצוק עם קוויק-דרו וחבל', en: 'Climber on a rock face with a quickdraw and rope' },
                text: { he: 'מה חייבים לוודא לפני שממשיכים לטפס אחרי הקליפ שבתמונה?', en: 'What must you verify before continuing to climb after the clip shown in the image?' },
                options: { he: ['שהחבל מוקלף בקרבינר התחתון שמיועד לחבל, שהשער סגור ושכיוון השער מנוגד לכיוון הטיפוס', 'שהחבל עובר מאחורי הגב כדי שלא יפריע', 'שהקוויק-דרו תלוי חופשי בלי חבל בתוכו', 'שאפשר להמשיך בלי להביט בציוד עד הבולט הבא'], en: ['The rope is clipped into the lower rope-side carabiner, the gate is closed, and the gate faces opposite to the direction of climbing', 'The rope runs behind your back so it does not get in the way', 'The quickdraw hangs freely with no rope in it', 'You can continue without checking the gear until the next bolt'] }, answer: 0
            }
        ];

        const quizApp = document.getElementById('quiz-app');
        const result = document.getElementById('quiz-result');
        const ui = copy[lang];
        let current = 0;
        let score = 0;
        let lead = { name: '', email: '', phone: '' };

        document.getElementById('quiz-title').textContent = ui.title;
        document.getElementById('quiz-intro').textContent = ui.intro;
        document.getElementById('quiz-back-link').textContent = ui.back;
        document.querySelectorAll('[data-lang-link]').forEach(link => {
            if (link.dataset.lang === lang) link.setAttribute('aria-current', 'page');
        });

        function renderLeadCapture() {
            quizApp.hidden = false;
            result.hidden = true;
            quizApp.innerHTML = `
                <form class="quiz-question-panel quiz-lead-form" id="quiz-lead-form">
                    <h2>${ui.leadTitle}</h2>
                    <p class="quiz-q9-note">${ui.leadIntro}</p>
                    <div class="quiz-lead-fields">
                        <label>${ui.name}<input type="text" name="name" autocomplete="name" required></label>
                        <label>${ui.email}<input type="email" name="email" autocomplete="email" required></label>
                        <label>${ui.phone}<input type="tel" name="phone" autocomplete="tel"></label>
                    </div>
                    <div class="quiz-actions">
                        <div class="quiz-error" id="lead-error" role="alert"></div>
                        <button class="quiz-submit" type="submit">${ui.start}</button>
                    </div>
                </form>
            `;
            document.getElementById('quiz-lead-form').addEventListener('submit', (event) => {
                event.preventDefault();
                const form = event.currentTarget;
                const formData = new FormData(form);
                lead = {
                    name: String(formData.get('name') || '').trim(),
                    email: String(formData.get('email') || '').trim(),
                    phone: String(formData.get('phone') || '').trim()
                };
                const error = document.getElementById('lead-error');
                if (!lead.name || !lead.email) {
                    error.textContent = ui.required;
                    return;
                }
                current = 0;
                score = 0;
                renderQuestion();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
        }

        function renderQuestion() {
            const question = questions[current];
            const progress = ((current + 1) / questions.length) * 100;
            const image = `<img class="quiz-image" src="${question.image}" alt="${question.imageAlt[lang]}" loading="eager">`;
            const note = `<p class="quiz-q9-note">${ui.note}</p>`;
            const options = question.options[lang].map((option, index) => `
                <label class="quiz-option">
                    <input type="radio" name="quiz-answer" value="${index}">
                    <span>${option}</span>
                </label>
            `).join('');

            quizApp.innerHTML = `
                <div class="quiz-progress-wrap">
                    <div class="quiz-progress-line">
                        <span>${ui.question(current + 1, questions.length)}</span>
                        <span>${Math.round(progress)}%</span>
                    </div>
                    <div class="quiz-progress" role="progressbar" aria-valuemin="1" aria-valuemax="${questions.length}" aria-valuenow="${current + 1}">
                        <div class="quiz-progress-bar" style="width: ${progress}%"></div>
                    </div>
                </div>
                <form class="quiz-question-panel" id="quiz-form">
                    ${image}
                    ${note}
                    <h2>${question.text[lang]}</h2>
                    <fieldset class="quiz-options">
                        <legend class="sr-only">${ui.options}</legend>
                        ${options}
                    </fieldset>
                    <div class="quiz-actions">
                        <div class="quiz-error" id="quiz-error" role="alert"></div>
                        <button class="quiz-submit" type="submit">${ui.submit}</button>
                    </div>
                </form>
            `;

            document.getElementById('quiz-form').addEventListener('submit', (event) => {
                event.preventDefault();
                const selected = document.querySelector('input[name="quiz-answer"]:checked');
                const error = document.getElementById('quiz-error');
                if (!selected) {
                    error.textContent = ui.error;
                    return;
                }
                if (Number(selected.value) === question.answer) score += 1;
                current += 1;
                if (current < questions.length) {
                    renderQuestion();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                } else {
                    showResult();
                }
            });
        }

        function showResult() {
            quizApp.hidden = true;
            result.hidden = false;
            const message = score >= 8 ? ui.resultExcellent : score >= 5 ? ui.resultGood : ui.resultReview;
            result.innerHTML = `
                <h2>${ui.finished}</h2>
                <div class="quiz-score" id="quiz-score" hidden>${score}/${questions.length}</div>
                <p id="quiz-result-message" hidden>${message}</p>
                <form class="quiz-interest-form" id="quiz-interest-form">
                    <h3>${ui.interestTitle}</h3>
                    <p class="quiz-q9-note">${ui.interestPrompt}</p>
                    <div class="quiz-interest-options">
                        <label><input type="radio" name="interest" value="yes" required> <span>${ui.interestYes}</span></label>
                        <label><input type="radio" name="interest" value="no"> <span>${ui.interestNo}</span></label>
                    </div>
                    <div class="quiz-actions">
                        <div class="quiz-error" id="interest-error" role="alert"></div>
                        <button class="quiz-submit" type="submit">${ui.send}</button>
                    </div>
                </form>
                <p class="quiz-send-status" id="quiz-send-status" role="status"></p>
                <button class="quiz-restart" type="button">${ui.retry}</button>
            `;
            const interestForm = document.getElementById('quiz-interest-form');
            interestForm.addEventListener('submit', async (event) => {
                event.preventDefault();
                const selected = interestForm.querySelector('input[name="interest"]:checked');
                const error = document.getElementById('interest-error');
                const status = document.getElementById('quiz-send-status');
                if (!selected) {
                    error.textContent = ui.required;
                    return;
                }
                const button = interestForm.querySelector('button[type="submit"]');
                button.disabled = true;
                button.textContent = ui.sending;
                const payload = new FormData();
                payload.append('name', lead.name);
                payload.append('email', lead.email);
                payload.append('phone', lead.phone);
                payload.append('score', `${score}/${questions.length}`);
                const wantsTraining = selected.value === 'yes';
                payload.append('training_interest', wantsTraining ? 'כן — מעוניין/ת בהדרכה, יש לחזור אליי' : 'לא מעוניין/ת כרגע');
                payload.append('message', `בוחן שליטה בהקלפות: ${score}/${questions.length}. ${wantsTraining ? 'המשתתף/ת מעוניין/ת בהדרכה — יש לחזור אליו/אליה.' : 'המשתתף/ת לא מעוניין/ת כרגע בהדרכה.'}`);
                payload.append('_subject', `ליד חדש מבוחן הקלפות — ${score}/${questions.length}${wantsTraining ? ' — מעוניין/ת בהדרכה' : ''}`);
                try {
                    const response = await fetch('https://formspree.io/f/mjkdalap', { method: 'POST', body: payload, headers: { Accept: 'application/json' } });
                    if (!response.ok) throw new Error('Form submission failed');
                    showCompletionScreen();
                } catch (submissionError) {
                    button.disabled = false;
                    button.textContent = ui.send;
                    status.textContent = ui.sendError;
                }
            });

            function showCompletionScreen() {
                result.innerHTML = `
                    <div class="quiz-complete-screen">
                        <img src="pics/safety-quiz-yonatan.webp" alt="יונתן מטפס" loading="eager">
                        <h2>${ui.completionTitle}</h2>
                        <div class="quiz-complete-score">${score}/${questions.length}</div>
                        <p>${ui.scoreLabel}</p>
                        <p>${ui.completionMessage}</p>
                        <p class="quiz-complete-tagline">${ui.completionTagline}</p>
                        <button class="quiz-restart" type="button">${ui.completionRetry}</button>
                    </div>
                `;
                result.querySelector('.quiz-restart').addEventListener('click', () => {
                    current = 0;
                    score = 0;
                    lead = { name: '', email: '', phone: '' };
                    result.hidden = true;
                    quizApp.hidden = false;
                    renderLeadCapture();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                });
            }

            result.querySelector('.quiz-restart').addEventListener('click', () => {
                current = 0;
                score = 0;
                lead = { name: '', email: '', phone: '' };
                result.hidden = true;
                quizApp.hidden = false;
                renderLeadCapture();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
        }

        renderLeadCapture();
    </script>
</body>
</html>
