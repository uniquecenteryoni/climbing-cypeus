<svg xmlns="http://www.w3.org/2000/svg" width="240mm" height="70mm" viewBox="0 0 240 70">
  <title>Climbing Cyprus car decal sketch</title>
  <desc>Single-color white vinyl decal for a black Skoda Yeti. Transparent background; artwork is white.</desc>
  <g fill="#fff">
    <!-- Compact mountain-and-climber mark -->
    <path d="M8 49 30 13l10 16 8-12 22 32H8Zm13-4h42L48 24l-8 13-10-15-9 23Z"/>
