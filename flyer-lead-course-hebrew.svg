<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1080" height="1440" viewBox="0 0 1080 1440">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#eef8ff" stop-opacity=".98"/>
      <stop offset=".52" stop-color="#dceeff" stop-opacity=".91"/>
      <stop offset="1" stop-color="#dceeff" stop-opacity=".16"/>
    </linearGradient>
    <linearGradient id="bottom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#082448" stop-opacity=".10"/>
      <stop offset="1" stop-color="#082448" stop-opacity=".94"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#061a35" flood-opacity=".25"/>
    </filter>
    <clipPath id="roundCard"><rect x="60" y="952" width="960" height="360" rx="30"/></clipPath>
  </defs>

  <!-- photographic background from the site's course hero -->
  <image x="0" y="0" width="1080" height="1440" preserveAspectRatio="xMidYMid slice" xlink:href="pics/course-lead-flyer-bg.png"/>
  <rect width="1080" height="1440" fill="url(#sky)"/>
  <rect x="0" y="0" width="600" height="1440" fill="#eef8ff" opacity=".30"/>
  <rect x="0" y="820" width="1080" height="620" fill="url(#bottom)"/>

  <!-- header -->
  <image x="70" y="54" width="172" height="116" preserveAspectRatio="xMidYMid meet" xlink:href="pics/climbing-cyprus-logo.webp"/>
  <text x="1000" y="92" text-anchor="end" direction="rtl" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#0b2347">CLIMBING CYPRUS</text>
  <text x="1000" y="120" text-anchor="end" direction="rtl" font-family="Arial, sans-serif" font-size="18" letter-spacing="4" fill="#5523c5">לגלות את הפסגה שלך</text>

  <!-- main title -->
  <text x="600" y="250" text-anchor="end" direction="rtl" font-family="Arial, sans-serif" font-size="92" font-weight="900" fill="#0b2347">קורס הובלה</text>
  <text x="600" y="342" text-anchor="end" direction="rtl" font-family="Arial, sans-serif" font-size="92" font-weight="900" fill="#0b2347">בטבע</text>
  <rect x="68" y="385" width="520" height="10" rx="5" fill="#ff4a1f"/>
  <text x="600" y="444" text-anchor="end" direction="rtl" font-family="Arial, sans-serif" font-size="32" font-weight="800" fill="#ff4a1f">להפוך למוביל עצמאי בשטח</text>

  <!-- course facts -->
  <g filter="url(#shadow)">
    <rect x="68" y="494" width="520" height="100" rx="24" fill="#ffffff" opacity=".94"/>
  </g>
  <g font-family="Arial, sans-serif" fill="#0b2347" text-anchor="middle">
    <text x="175" y="548" font-size="32" font-weight="900">3 ימים</text>
    <text x="175" y="575" font-size="17">קורס מעשי</text>
    <text x="328" y="548" font-size="32" font-weight="900">20 שעות</text>
    <text x="328" y="575" font-size="17">הדרכה ותרגול</text>
    <text x="485" y="548" font-size="32" font-weight="900">1:4</text>
    <text x="485" y="575" font-size="17">יחס הדרכה</text>
  </g>
  <g fill="#ff4a1f"><circle cx="252" cy="544" r="6"/><circle cx="405" cy="544" r="6"/></g>

  <!-- lower information card -->
  <g clip-path="url(#roundCard)">
    <rect x="60" y="952" width="960" height="360" fill="#f7fbff" opacity=".97"/>
    <rect x="60" y="952" width="16" height="360" fill="#ff4a1f"/>
  </g>
  <text x="960" y="1015" text-anchor="end" direction="rtl" font-family="Arial, sans-serif" font-size="43" font-weight="900" fill="#0b2347">מה נלמד בקורס?</text>
  <rect x="520" y="1034" width="440" height="5" rx="3" fill="#ff4a1f"/>
  <g font-family="Arial, sans-serif" font-size="23" fill="#0b2347" direction="rtl">
    <circle cx="905" cy="1080" r="7" fill="#ff4a1f"/><text x="880" y="1088" text-anchor="end">עקרונות בטיחות בטיפוס הובלה</text>
    <circle cx="905" cy="1124" r="7" fill="#ff4a1f"/><text x="880" y="1132" text-anchor="end">אבטחת מטפס מוביל וניהול חבל</text>
    <circle cx="905" cy="1168" r="7" fill="#ff4a1f"/><text x="880" y="1176" text-anchor="end">שימוש נכון ב־Quickdraws והקלפות</text>
    <circle cx="905" cy="1212" r="7" fill="#ff4a1f"/><text x="880" y="1220" text-anchor="end">נפילות מבוקרות, ניקוי תחנה ופתרון תקלות</text>
    <circle cx="905" cy="1256" r="7" fill="#ff4a1f"/><text x="880" y="1264" text-anchor="end">תכנון יום טיפוס עצמאי במסלולים שונים</text>
  </g>

  <!-- certificate badge -->
  <g filter="url(#shadow)">
    <rect x="92" y="1040" width="310" height="190" rx="24" fill="#fff7ef" stroke="#ff4a1f" stroke-width="5"/>
  </g>
  <text x="247" y="1098" text-anchor="middle" direction="rtl" font-family="Arial, sans-serif" font-size="29" font-weight="900" fill="#0b2347">תעודת מוביל</text>
  <text x="247" y="1134" text-anchor="middle" direction="rtl" font-family="Arial, sans-serif" font-size="29" font-weight="900" fill="#0b2347">עצמאי בסיום</text>
  <text x="247" y="1178" text-anchor="middle" direction="rtl" font-family="Arial, sans-serif" font-size="18" fill="#ff4a1f">כלים אמיתיים לשטח</text>

  <!-- CTA -->
  <rect x="168" y="1350" width="744" height="70" rx="35" fill="#ff4a1f" stroke="#ffffff" stroke-width="5"/>
  <text x="540" y="1397" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="900" fill="#ffffff">climbing-cyprus.com/course  ›</text>
  <text x="540" y="1330" text-anchor="middle" direction="rtl" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#ffffff">חוברת קורס  •  תרגול מעשי  •  תעודה בסיום</text>
</svg>
