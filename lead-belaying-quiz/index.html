</style><link rel="icon" href="/favicon.webp"><link rel="stylesheet" href="/lead-belaying-quiz/brand.css?v=20261001"><link rel="stylesheet" href="/quiz-presentation.css?v=20261002"></head><body><main><header><a class="brand" href="/" aria-label="Climbing Cyprus"><img src="/pics/climbing-cyprus-logo.webp" alt="Climbing Cyprus" width="150" height="86"></a><div class="switch"><button class="lang" data-lang="he" aria-pressed="false">עברית</button><button class="lang" data-lang="en" aria-pressed="true">English</button></div><a class="quiz-home-link" href="/#quizzes" id="all-quizzes">לכל הבחנים</a></header><section id="intro"><img class="quiz-cover" id="quiz-cover" src="/pics/lead-belaying-quiz-he.jpg" alt="בוחן אבטחת מוביל" width="1000" height="1000"><div class="eyebrow" id="eyebrow"></div><h1 id="title"></h1><p class="muted" id="subtitle"></p><div class="card"><h2 id="introtitle"></h2><p id="introtext"></p><p class="muted" id="introhint"></p><div class="actions"><button class="primary" id="start"></button></div></div></section><section id="quiz" hidden><div class="meta"><span id="count"></span><span id="type"></span></div><div class="progress" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="10" aria-valuenow="0"><div class="bar"></div></div><div class="card"><h2 id="question" tabindex="-1"></h2><div class="image" id="image"></div><p class="caption" id="caption"></p><fieldset class="choices" id="choices"><legend class="sr-only" id="legend"></legend></fieldset><div id="feedback" aria-live="polite" hidden></div><div class="actions"><button class="primary" id="check" disabled></button><button class="primary" id="next" hidden></button></div></div></section><section id="result" hidden><div class="eyebrow" id="resultlabel"></div><h1 id="resulttitle" tabindex="-1"></h1><div class="card"><div class="score" id="score"></div><p id="resulttext"></p><p class="muted" id="resultnote"></p><div class="actions"><button class="primary" id="restart"></button><a class="secondary" href="https://climbing-cyprus.com/en/climber-guide" id="guide"></a></div></div><div class="card" id="review"></div></section><footer><p id="disclaimer"></p><details><summary id="sourceslabel"></summary><ul><li><a href="https://www.petzl.com/US/en/Sport/Spotting-and-belaying-at-the-start-of-the-route">Petzl — Spotting and belaying at the start</a></li><li><a href="https://www.petzl.com/INT/en/Sport/Dynamic-belaying-with-the-GRIGRI">Petzl — Dynamic belaying</a></li><li><a href="https://publications.americanalpineclub.org/articles/13201215895">American Alpine Club — Dynamic belaying</a></li><li><a href="https://edelrid.com/eu-en/sport/brake-assistants-shop">EDELRID — Weight differences and brake assistants</a></li></ul></details></footer></main><script>
const DATA=[{"id": 1, "topic": "Position", "question": {"en": "On this clear, level base, which starting position is the best choice after clipping the first bolt?", "he": "בבסיס המצוק המישורי והפנוי הזה, איזה מיקום מתאים ביותר לאחר הקלפת הבולט הראשון?"}, "options": {"en": ["A — Far back from the wall", "B — Close to the wall and offset from the climber’s fall line", "C — Directly beneath the climber"], "he": ["A — רחוק מהקיר", "B — קרוב לקיר ומחוץ לקו הנפילה של המטפס", "C — ישירות מתחת למטפס"]}, "correct": [1], "explanation": {"en": "Choose a stable position near the wall, offset from the likely fall path. Stay attentive and mobile; terrain, the first protection point and any additional belay-assist device can change the appropriate position.", "he": "בחרו עמדה יציבה בקרבת הקיר ומחוץ למסלול הנפילה הצפוי. הישארו קשובים ומוכנים לתנועה. תוואי הקרקע, נקודת האבטחה הראשונה ומכשיר עזר נוסף עשויים לשנות את המיקום המתאים."}, "image": "assets/question-01.svg", "caption": {"en": "A, B and C show three possible belayer positions.", "he": "A, B ו־C מציגים שלושה מיקומים אפשריים למאבטח."}, "multiple": false, "scene": "position"}, {"id": 2, "topic": "Slack", "question": {"en": "The climber is moving normally above several bolts, with no nearby obstacles. Which rope-management approach is best?", "he": "המטפס מתקדם כרגיל מעל כמה בולטים, ללא מכשולים קרובים. איזו דרך לניהול החבל מתאימה ביותר?"}, "options": {"en": ["Keep the rope tight enough to pull on the climber", "Keep a large loop ready at all times", "Adjust slack continuously so the climber can move without unnecessary excess"], "he": ["לשמור חבל מתוח שמושך את המטפס", "להחזיק תמיד לולאת חבל גדולה", "להתאים את החבל כל הזמן, לאפשר תנועה ולמנוע עודף מיותר"]}, "correct": [2], "explanation": {"en": "Slack is a changing amount, not a fixed loop size. Watch movement and clipping, feed and take in rope promptly, and maintain control of the brake strand. A still illustration cannot establish a universally safe amount.", "he": "כמות החבל משתנה ואינה גודל קבוע של לולאה. עקבו אחרי התנועה וההקלפות, הוציאו ואספו חבל בזמן ושמרו על שליטה בצד הבלימה. אי אפשר לקבוע כמות בטוחה לכל מצב מתוך תמונה בלבד."}, "image": "assets/question-02.svg", "caption": {"en": "Three schematic rope states: tight, moderate and excessive.", "he": "שלושה מצבי חבל סכמטיים: מתוח, רפיון מתון ועודף גדול."}, "multiple": false, "scene": "slack"}, {"id": 3, "topic": "Before the first bolt", "question": {"en": "Before the first bolt is clipped, what is the purpose of spotting when it is appropriate for this start?", "he": "לפני הקלפת הבולט הראשון, מה מטרת הספוטינג כאשר הוא מתאים לתחילת המסלול?"}, "options": {"en": ["Catch and hold the climber’s full body weight", "Help guide a fall toward a feet-first landing and reduce the chance of a head or back impact", "The rope already protects the climber as if a bolt were clipped"], "he": ["לתפוס ולהחזיק את מלוא משקל המטפס", "לסייע לכוון נחיתה על הרגליים ולהפחית פגיעה בראש או בגב", "החבל כבר מגן על המטפס כאילו הוקלפ בולט"]}, "correct": [1], "explanation": {"en": "Spotting aims to guide the landing, not catch the climber’s weight. Before starting, assess height, terrain and whether spotting is appropriate. The rope and device are prepared for a prompt transition after the first clip.", "he": "מטרת הספוטינג היא לסייע בכיוון הנחיתה, ולא לתפוס את משקל המטפס. לפני ההתחלה בוחנים את הגובה, הקרקע והתאמת הספוטינג. החבל והמכשיר מוכנים למעבר מהיר לאבטחה אחרי ההקלפה הראשונה."}, "image": "assets/question-03.svg", "caption": {"en": "The first protection point has not been clipped. The rope is prepared but offers no protection through a bolt yet.", "he": "נקודת האבטחה הראשונה עדיין לא הוקלפה. החבל מוכן, אך עדיין לא עובר דרך בולט."}, "multiple": false, "scene": "spot"}, {"id": 4, "topic": "Transition", "question": {"en": "The climber has just clipped the first quickdraw. What should the belayer do?", "he": "המטפס הקליפ עכשיו את הראנר הראשון. מה המאבטח צריך לעשות?"}, "options": {"en": ["Continue spotting until the second bolt", "Immediately transition to normal belaying with control of the brake strand", "Move far back to improve the view"], "he": ["להמשיך בספוטינג עד הבולט השני", "לעבור מיד לאבטחה רגילה עם שליטה בצד הבלימה", "להתרחק מאוד מהקיר כדי לשפר את שדה הראייה"]}, "correct": [1], "explanation": {"en": "Once the first protection point is clipped, transition to normal belaying. Manage slack actively and anticipate low falls. One clipped bolt does not guarantee enough clearance from the ground.", "he": "מרגע שהוקלפה נקודת האבטחה הראשונה עוברים לאבטחה רגילה. מנהלים את החבל באופן פעיל וערוכים לנפילה נמוכה. בולט אחד שהוקלפ אינו מבטיח מרווח מספיק מעל הקרקע."}, "image": "assets/question-04.svg", "caption": {"en": "Left: before the clip. Right: the first quickdraw is clipped.", "he": "משמאל: לפני ההקלפה. מימין: הראנר הראשון הוקלפ."}, "multiple": false, "scene": "transition"}, {"id": 5, "topic": "Low fall", "question": {"en": "Only the first bolt is clipped, and the climber is moving toward the second. What is the main risk to assess?", "he": "רק הבולט הראשון הוקלפ והמטפס מתקדם לשני. מה הסיכון המרכזי שצריך להעריך?"}, "options": {"en": ["A ground fall despite the first bolt being clipped", "There is no ground-fall risk once any bolt is clipped", "Only discomfort from a hard catch"], "he": ["פגיעה בקרקע למרות הקלפת הבולט הראשון", "אין סיכון לקרקע אחרי הקלפת בולט כלשהו", "רק אי־נוחות מבלימה קשה"]}, "correct": [0], "explanation": {"en": "Low protection can leave little clearance. Climber height above the clip, slack, rope stretch and belayer displacement all influence the outcome. Remain especially alert during the early clips.", "he": "נקודת אבטחה נמוכה עלולה להשאיר מעט מרווח. גובה המטפס מעל ההקלפה, עודף החבל, התארכות החבל ותנועת המאבטח משפיעים על התוצאה. נדרשת ערנות מיוחדת בהקלפות הראשונות."}, "image": "assets/question-05.svg", "caption": {"en": "The climber is above the first clipped point; the second point is still unclipped.", "he": "המטפס מעל הנקודה הראשונה שהוקלפה; הנקודה השנייה עדיין לא הוקלפה."}, "multiple": false, "scene": "low"}, {"id": 6, "topic": "Second clip", "question": {"en": "Why can pulling rope to clip the second bolt be a particularly critical moment?", "he": "למה משיכת חבל להקלפת הבולט השני יכולה להיות רגע קריטי במיוחד?"}, "options": {"en": ["Until the clip is complete, the extra rope can increase fall distance while protection is still low", "Pulling rope always shortens a fall", "The second bolt protects the climber as soon as they reach toward it"], "he": ["עד השלמת ההקלפה, החבל הנוסף עלול להגדיל את מרחק הנפילה כשהאבטחה עדיין נמוכה", "משיכת חבל תמיד מקצרת את הנפילה", "הבולט השני מגן על המטפס מיד כשהוא מושיט אליו יד"]}, "correct": [0], "explanation": {"en": "Reaching for an unclipped point does not add protection. Pay out the rope needed for the clip without unnecessary excess, keep brake-strand control and take back unneeded slack promptly. Assess the start together beforehand.", "he": "הושטת יד לנקודה שלא הוקלפה אינה מוסיפה אבטחה. נותנים את החבל הדרוש להקלפה בלי עודף מיותר, שומרים על צד הבלימה ואוספים חבל שאין בו צורך בזמן. מעריכים יחד את תחילת המסלול מראש."}, "image": "assets/question-06.svg", "caption": {"en": "The climber holds a bight of rope near the second point. The rope is not yet clipped there.", "he": "המטפס מחזיק לולאת חבל ליד הנקודה השנייה. החבל עדיין לא הוקלפ אליה."}, "multiple": false, "scene": "clip"}, {"id": 7, "topic": "Weight difference", "question": {"en": "The belayer is substantially lighter than the climber. What should the pair consider before starting?", "he": "המאבטח קל משמעותית מהמטפס. מה על השניים לשקול לפני ההתחלה?"}, "options": {"en": ["A larger permanent slack loop solves the difference", "A risk assessment for belayer lift, collision and ground clearance, with an appropriate mitigation if needed", "An assisted-braking belay device eliminates the weight difference"], "he": ["לולאת חבל גדולה וקבועה פותרת את ההפרש", "להעריך התרוממות מאבטח, התנגשות ומרווח מהקרקע, ולבחור מענה מתאים לפי הצורך", "מכשיר אבטחה עם בלימה מסייעת מבטל את הפרש המשקל"]}, "correct": [1], "explanation": {"en": "A lighter belayer can be lifted or pulled toward the first point. Plan for clearance and collision risks. Where suitable, use a compatible belay-assist solution according to its own instructions and with training; do not improvise a ground anchor or assume a GRIGRI solves the difference.", "he": "מאבטח קל עלול להתרומם או להימשך לנקודה הראשונה. מתכננים לפי סכנת התנגשות והמרווח לקרקע. לפי הצורך משתמשים בפתרון עזר מתאים לפי הוראותיו ועם הדרכה; לא מאלתרים עיגון לקרקע ולא מניחים שגריגרי פותר את ההפרש."}, "image": "assets/question-07.svg", "caption": {"en": "A larger climber and a smaller belayer illustrate a weight difference, not a recommended equipment setup.", "he": "מטפס גדול ומאבטח קטן ממחישים הפרש משקל; זה אינו תרשים התקנת ציוד מומלץ."}, "multiple": false, "scene": "weight"}, {"id": 8, "topic": "Ledge", "question": {"en": "A ledge lies below the climber’s possible fall path. Is deliberately lengthening the catch always appropriate?", "he": "מדף נמצא מתחת למסלול הנפילה האפשרי. האם תמיד מתאים להאריך במכוון את הבלימה?"}, "options": {"en": ["Yes — the longer the catch, the safer it is", "Yes — provided the device has assisted braking", "No — avoiding the ledge takes priority over deliberately extending the fall"], "he": ["כן — ככל שהבלימה ארוכה יותר היא בטוחה יותר", "כן — בתנאי שהמכשיר בעל בלימה מסייעת", "לא — מניעת פגיעה במדף קודמת להארכה מכוונת של הנפילה"]}, "correct": [2], "explanation": {"en": "Adapt the catch to the available clearance. Where a ledge or the ground is a threat, avoid unnecessary slack and deliberate extra travel. Softer does not mean a large slack loop; catching skills require supervised practice.", "he": "מתאימים את הבלימה למרווח הקיים. כאשר יש סיכון לפגיעה במדף או בקרקע, נמנעים מעודף חבל ומתנועה נוספת מכוונת שמאריכה את הנפילה. בלימה רכה אינה לולאת חבל גדולה; מיומנות הבלימה דורשת תרגול מודרך."}, "image": "assets/question-08.svg", "caption": {"en": "A ledge interrupts the space below the climber. No predicted fall distance is shown.", "he": "מדף חוצה את המרחב שמתחת למטפס. האיור אינו מחשב את מרחק הנפילה."}, "multiple": false, "scene": "ledge"}, {"id": 9, "topic": "Far from the wall", "question": {"en": "Why can standing far back from this wall be problematic during a low fall?", "he": "מדוע עמידה רחוקה מהקיר הזה עלולה להיות בעייתית בנפילה נמוכה?"}, "options": {"en": ["The belayer may be pulled forward, adding travel to the fall and risking loss of balance or collision", "Being farther away always makes the fall shorter", "Distance is irrelevant if the brake hand is on the rope"], "he": ["המאבטח עלול להימשך קדימה, להוסיף מרחק לנפילה ולאבד שיווי משקל או להתנגש", "מרחק גדול יותר תמיד מקצר את הנפילה", "המרחק לא חשוב אם יד הבלימה על החבל"]}, "correct": [0], "explanation": {"en": "Distance and stance affect belayer displacement. On this unobstructed base, use a stable position near the wall and outside the fall path, rather than relying on a backward stance. Reassess if terrain or device-specific instructions require another position.", "he": "המרחק והעמידה משפיעים על תנועת המאבטח. בבסיס הפנוי הזה בוחרים עמדה יציבה בקרבת הקיר ומחוץ לקו הנפילה. אם תוואי הקרקע או הוראות מכשיר מסוים מחייבים מיקום אחר, מעריכים מחדש."}, "image": "assets/question-09.svg", "caption": {"en": "The belayer is far from the wall; a dashed arrow shows a possible forward pull.", "he": "המאבטח רחוק מהקיר; חץ מקווקו מציג משיכה אפשרית קדימה."}, "multiple": false, "scene": "far"}, {"id": 10, "topic": "Spot the mistakes", "question": {"en": "Select all four visible belayer problems in this scene.", "he": "סמנו את כל ארבע הבעיות הנראות אצל המאבטח באיור."}, "options": {"en": ["The belayer is far from the wall", "There is a large unnecessary slack loop during a low clip", "The brake strand is not held", "A bag obstructs the belayer’s movement", "The climber is wearing a helmet"], "he": ["המאבטח רחוק מהקיר", "יש לולאת חבל עודפת גדולה בהקלפה נמוכה", "צד הבלימה אינו מוחזק", "תיק מפריע לתנועת המאבטח", "המטפס חובש קסדה"]}, "correct": [0, 1, 2, 3], "explanation": {"en": "The four visible problems are distance, excess slack, an unheld brake strand and an obstructed movement area. Together they reduce control during a critical low clip. The helmet is not a mistake. Fix the setup before continuing.", "he": "ארבע הבעיות הן מרחק, עודף חבל, צד בלימה שאינו מוחזק וחסימת אזור התנועה. יחד הן פוגעות בשליטה ברגע של הקלפה נמוכה. קסדה אינה טעות. מתקנים את המצב לפני שממשיכים."}, "image": "assets/question-10.svg", "caption": {"en": "One scene contains four deliberate errors. Choose every applicable answer.", "he": "האיור מכיל ארבע טעויות מכוונות. בחרו את כל התשובות המתאימות."}, "multiple": true, "scene": "mistakes"}];const SVGS=["<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1220 400\" role=\"img\" aria-labelledby=\"title desc\"><title id=\"title\">Question 1: Position</title><desc id=\"desc\">A, B and C show three possible belayer positions. Generic symbols; not to scale. Belay-device threading is not illustrated.</desc><g font-family=\"Arial,sans-serif\" fill=\"#204a3a\"><g transform=\"translate(0 0)\"><rect width=\"400\" height=\"400\" rx=\"14\" fill=\"#f1f3ed\"/><path d=\"M 0 0 H 65 L 76 80 L 68 145 L 77 220 L 68 300 L 76 365 H 0 Z\" fill=\"#ddd4c4\"/><path d=\"M 0 380 H400\" stroke=\"#9ca998\" stroke-width=\"3\"/><text x=\"350\" y=\"38\" font-size=\"25\" font-weight=\"700\">A</text><circle cx=\"82\" cy=\"260\" r=\"4\" fill=\"#657567\"/><path d=\"M 84 260 L95 273\" stroke=\"#415650\" stroke-width=\"4\"/><ellipse cx=\"98\" cy=\"277\" rx=\"6\" ry=\"8\" stroke=\"#415650\" fill=\"none\" stroke-width=\"2\"/><circle cx=\"82\" cy=\"155\" r=\"4\" fill=\"#657567\"/><path d=\"M 84 155 L95 168\" stroke=\"#415650\" stroke-width=\"4\"/><ellipse cx=\"98\" cy=\"172\" rx=\"6\" ry=\"8\" stroke=\"#415650\" fill=\"none\" stroke-width=\"2\"/><circle cx=\"82\" cy=\"65\" r=\"4\" fill=\"#657567\"/><path d=\"M 84 65 L95 78\" stroke=\"#415650\" stroke-wid const UI={en:{eyebrow:'Safety challenge · 10 questions',title:'Lead Belaying Safety Challenge',subtitle:'Read the situation. Spot the risk. Make a better decision.',introtitle:'How sharp is your belaying judgement?',introtext:'10 illustrated scenarios covering belayer position, rope management, early clips and fall clearance.',introhint:'One point per question. Get an explanation after every answer. The final question has multiple answers.',start:'Start the challenge',check:'Check answer',next:'Next question',finish:'See my results',one:'Choose one answer',multi:'Select all four problems',diagram:'Schematic only · not to scale · generic device symbols',correct:'Correct',incorrect:'Review this situation',right:'Correct answer',yours:'Your answer',resultlabel:'Challenge complete',resulttitle:'Your results',resultnote:'A quiz score is knowledge feedback, not proof of practical belaying competence.',restart:'Try again',guide:'Climber guide',disclaimer:'Educational review for sport lead belaying. This does not replace practical instruction or manufacturer instructions. Diagrams simplify the equipment and do not show device threading.',sourceslabel:'Technical references',great:'You recognised the key risks. Review the explanations and apply your judgement with supervised practice.',improve:'Review the situations you missed, especially low falls and brake-strand control.',review:'Review all answers',none:'No answer'},he:{eyebrow:'אתגר בטיחות · 10 שאלות',title:'בוחן אבטחת מוביל',subtitle:'קוראים את המצב. מזהים את הסיכון. בוחרים החלטה נכונה.',introtitle:'עד כמה שיקול הדעת שלכם באבטחה חד?',introtext:'10 תרחישים מאוירים על מיקום המאבטח, ניהול החבל, ההקלפות הראשונות והמרווח לנפילה.',introhint:'נקודה לכל שאלה, עם הסבר אחרי כל תשובה. בשאלה האחרונה בוחרים כמה תשובות.',start:'מתחילים את הבוחן',check:'בדיקת תשובה',next:'לשאלה הבאה',finish:'לציון שלי',one:'בחרו תשובה אחת',multi:'סמנו את כל ארבע הבעיות',diagram:'איור סכמטי · לא בקנה מידה · סמלי ציוד כלליים',correct:'תשובה נכונה',incorrect:'כדאי לבחון שוב את המצב',right:'התשובה הנכונה',yours:'התשובה שלכם',resultlabel:'הבוחן הושלם',resulttitle:'התוצאות שלכם',resultnote:'הציון משקף ידע בלבד ואינו מעיד על כשירות מעשית באבטחה.',restart:'ניסיון נוסף',guide:'המדריך למטפס',disclaimer:'חזרה לימודית לאבטחת הובלה ספורטיבית. אינה מחליפה הדרכה מעשית או הוראות יצרן. האיורים מפשטים את הציוד ואינם מציגים השחלת מכשיר.',sourceslabel:'מקורות מקצועיים',great:'זיהיתם את הסיכונים המרכזיים. עברו על ההסברים ותרגלו את שיקול הדעת בהדרכה.',improve:'עברו על המצבים שבהם טעיתם, במיוחד נפילות נמוכות ושליטה בצד הבלימה.',review:'סקירת התשובות',none:'ללא תשובה'}};
let lang=new URLSearchParams(location.search).get('lang')==='en'?'en':'he',step=0,answers=[],checked=false,view='intro';const $=id=>document.getElementById(id);const escapeHTML=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function applyLanguage(){$('quiz-cover').src='/pics/lead-belaying-quiz-'+lang+'.jpg';$('quiz-cover').alt=UI[lang].title;$('all-quizzes').textContent=lang==='he'?'לכל הבחנים':'All quizzes';$('all-quizzes').href=lang==='he'?'/#quizzes':'/en/#quizzes';document.querySelector('.brand').href=lang==='he'?'/':'/en/';document.querySelector('[role=progressbar]').setAttribute('aria-label',lang==='he'?'התקדמות הבוחן':'Quiz progress');document.documentElement.lang=lang;document.documentElement.dir=lang==='he'?'rtl':'ltr';document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===lang)));for(const id of ['eyebrow','title','subtitle','introtitle','introtext','introhint','start','restart','guide','resultlabel','resulttitle','resultnote','disclaimer','sourceslabel'])$(id).textContent=UI[lang][id];$('guide').href=lang==='he'?'https://climbing-cyprus.com/climber-guide':'https://climbing-cyprus.com/en/climber-guide';document.title=UI[lang].title+' | Climbing Cyprus';if(view==='quiz')renderQuestion();if(view==='result')renderResults();}
function show(v){view=v;['intro','quiz','result'].forEach(id=>$(id).hidden=id!==v)}
function selected(){return [...$('choices').querySelectorAll('input:checked')].map(i=>Number(i.value))}
function isCorrect(a,q){return a.length===q.correct.length&&q.correct.every(i=>a.includes(i))}
function renderQuestion(){const q=DATA[step],t=UI[lang];$('count').textContent=lang==='he'?`שאלה ${step+1} מתוך 10`:`Question ${step+1} of 10`;$('type').textContent=q.multiple?t.multi:t.one;$('question').textContent=q.question[lang];$('caption').textContent=q.caption[lang]+' '+t.diagram;const parsed=new DOMParser().parseFromString(SVGS[step],'image/svg+xml');const panels=[...parsed.querySelector('svg > g').children];$('image').innerHTML=panels.map((panel,i)=>`<div class="panel"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="${escapeHTML(q.caption[lang]+' '+(panels.length>1?String.fromCharCode(65+i):''))}"><g font-family="Arial,sans-serif" fill="#204a3a">${panel.innerHTML}</g></svg></div>`).join('');$('choices').innerHTML=`<legend class="sr-only" id="legend">${q.multiple?t.multi:t.one}</legend>`+q.options[lang].map((opt,i)=>`<label class="choice"><input type="${q.multiple?'checkbox':'radio'}" name="answer" value="${i}" ${answers[step]?.includes(i)?'checked':''} ${checked?'disabled':''}><span>${escapeHTML(opt)}</span></label>`).join('');$('choices').onchange=()=>{$('check').disabled=selected().length===0};$('check').textContent=t.check;$('check').hidden=checked;$('check').disabled=selected().length===0;$('next').textContent=step===9?t.finish:t.next;$('next').hidden=!checked;document.querySelector('.bar').style.width=((step+(checked?1:0))/10*100)+'%';document.querySelector('[role=progressbar]').setAttribute('aria-valuenow',step+(checked?1:0));$('feedback').hidden=!checked;if(checked)renderFeedback();}
function renderFeedback(){const q=DATA[step],a=answers[step],ok=isCorrect(a,q),t=UI[lang];$('feedback').className='feedback'+(ok?'':' bad');$('feedback').innerHTML=`<h3>${ok?t.correct:t.incorrect}</h3><p>${escapeHTML(q.explanation[lang])}</p><p><strong>${t.right}:</strong> ${q.correct.map(i=>escapeHTML(q.options[lang][i])).join(' · ')}</p>`;[...$('choices').querySelectorAll('.choice')].forEach((label,i)=>{if(q.correct.includes(i))label.classList.add('good');else if(a.includes(i))label.classList.add('wrong')});}
function renderResults(){const t=UI[lang],score=DATA.reduce((s,q,i)=>s+Number(isCorrect(answers[i]||[],q)),0);$('score').textContent=`${score} / 10`;$('resulttext').textContent=score>=8?t.great:t.improve;$('review').innerHTML=`<h2>${t.review}</h2>`+DATA.map((q,i)=>`<details><summary>${i+1}. ${escapeHTML(q.question[lang])} — ${isCorrect(answers[i]||[],q)?t.correct:t.incorrect}</summary><p><strong>${t.yours}:</strong> ${(answers[i]||[]).map(j=>escapeHTML(q.options[lang][j])).join(' · ')||t.none}</p><p><strong>${t.right}:</strong> ${q.correct.map(j=>escapeHTML(q.options[lang][j])).join(' · ')}</p><p>${escapeHTML(q.explanation[lang])}</p></details>`).join('');}
$('start').onclick=()=>{show('quiz');renderQuestion();$('question').focus()};$('check').onclick=()=>{if(!selected().length)return;answers[step]=selected();checked=true;renderQuestion();$('next').focus()};$('next').onclick=()=>{if(step===9){show('result');renderResults();$('resulttitle').focus()}else{step++;checked=false;renderQuestion();$('question').focus()}};$('restart').onclick=()=>{step=0;answers=[];checked=false;show('quiz');renderQuestion();$('question').focus()};document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{if(view==='quiz'&&!checked)answers[step]=selected();lang=b.dataset.lang;history.replaceState(null,'',lang==='en'?'?lang=en':location.pathname);applyLanguage()});applyLanguage();
</script></body></html>
