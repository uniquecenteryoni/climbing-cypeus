    <text x="78" y="50" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" letter-spacing="1.2">CYPRUS</text>
    <path d="M78 56h149v1.4H78z"/>
    <text x="78" y="66" font-family="Arial, Helvetica, sans-serif" font-size="6.2" font-weight="600" letter-spacing="1.05">GUIDING  •  COURSES  •  ADVENTURES</text>
