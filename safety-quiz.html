<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="בוחן בטיחות קצר למטפסים: קשרים, אבטחה, קליפים וקבלת החלטות על המצוק.">
    <title>עד כמה אתה מרגיש בטוח להקליפ? | Climbing Cyprus</title>
    <link rel="icon" type="image/webp" href="favicon.webp?v=20260819">
    <link rel="stylesheet" href="style.css?v=safety-quiz-1">
    <style>
        :root {
            --quiz-green: #173d2a;
            --quiz-green-light: #2c5f2d;
            --quiz-lime: #b5d87a;
            --quiz-ink: #1e2e25;
            --quiz-muted: #617067;
            --quiz-paper: #f7f8f3;
        }

        body.safety-quiz-page {
            min-height: 100vh;
            margin: 0;
            background: var(--quiz-paper);
            color: var(--quiz-ink);
            font-family: var(--font-primary);
        }

        .quiz-shell {
            width: min(760px, calc(100% - 32px));
            margin: 0 auto;
            padding: 1.5rem 0 4rem;
        }

        .quiz-topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .quiz-brand {
            display: inline-flex;
            align-items: center;
            gap: 0;
            color: var(--quiz-green);
            font-weight: 800;
            text-decoration: none;
        }

        .quiz-brand img {
            width: 150px;
            height: 86px;
            padding: 0;
            border-radius: 0;
            object-fit: contain;
            background: transparent;
        }

        .quiz-brand span {
            display: none;
        }

        .quiz-language {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            direction: ltr;
        }

        .quiz-language a {
            padding: 0.35rem 0.55rem;
            border: 1px solid #dfe7dc;
            border-radius: 999px;
            color: var(--quiz-green-light);
            font-size: 0.82rem;
            font-weight: 800;
            text-decoration: none;
        }

        .quiz-language a[aria-current="page"] {
            border-color: var(--quiz-green);
            background: var(--quiz-green);
            color: #fff;
        }

        .quiz-back-link {
            color: var(--quiz-green-light);
            font-weight: 700;
            text-decoration: none;
        }

        .quiz-hero {
            margin-bottom: 1.75rem;
            text-align: center;
        }

        .quiz-hero h1 {
            margin: 0 0 0.65rem;
            color: var(--quiz-green);
            font-size: clamp(2rem, 6vw, 3.3rem);
            line-height: 1.1;
        }

        .quiz-hero p {
            max-width: 600px;
            margin: 0 auto;
            color: var(--quiz-muted);
            font-size: 1.05rem;
            line-height: 1.7;
        }

        .quiz-card {
            overflow: hidden;
            border: 1px solid #dfe7dc;
            border-radius: 1.25rem;
            background: #fff;
            box-shadow: 0 18px 45px rgba(23, 61, 42, 0.1);
        }

        .quiz-progress-wrap {
            padding: 1.2rem 1.4rem 0;
        }

        .quiz-progress-line {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            margin-bottom: 0.6rem;
            color: var(--quiz-muted);
            font-size: 0.88rem;
            font-weight: 700;
        }

        .quiz-progress {
            height: 8px;
            overflow: hidden;
            border-radius: 999px;
            background: #e9efe5;
        }

        .quiz-progress-bar {
            width: 11.11%;
            height: 100%;
            border-radius: inherit;
            background: var(--quiz-lime);
            transition: width 220ms ease;
        }

        .quiz-question-panel {
            padding: 1.75rem 1.4rem 1.5rem;
        }

        .quiz-question-panel h2 {
            margin: 0 0 1.35rem;
            color: var(--quiz-green);
            font-size: clamp(1.35rem, 4vw, 1.85rem);
            line-height: 1.35;
        }

        .quiz-options {
            display: grid;
            gap: 0.75rem;
            margin: 0;
            padding: 0;
            border: 0;
        }

        .quiz-option {
            position: relative;
            display: flex;
            align-items: flex-start;
            gap: 0.7rem;
            padding: 0.9rem 1rem;
            border: 1px solid #dfe7dc;
            border-radius: 0.75rem;
            background: #fff;
            cursor: pointer;
            line-height: 1.5;
            transition: border-color 150ms ease, background 150ms ease, transform 150ms ease;
        }

        .quiz-option:hover,
        .quiz-option:has(input:focus-visible) {
            border-color: var(--quiz-lime);
            background: #fbfdf8;
        }

        .quiz-option:has(input:checked) {
            border-color: var(--quiz-green-light);
            background: #f1f7ea;
            transform: translateY(-1px);
        }

        .quiz-option input {
            flex: 0 0 auto;
            width: 1.1rem;
            height: 1.1rem;
            margin-top: 0.18rem;
            accent-color: var(--quiz-green-light);
        }

        .quiz-image {
            width: 100%;
            height: min(62vh, 620px);
            margin: 0 0 1.25rem;
            border-radius: 0.9rem;
            object-fit: contain;
            object-position: center;
            background: #e9efe5;
        }

        .quiz-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .quiz-error {
            min-height: 1.4em;
            color: #a34234;
            font-size: 0.9rem;
            font-weight: 700;
        }

        .quiz-submit,
        .quiz-restart {
            border: 0;
            border-radius: 999px;
            padding: 0.85rem 1.35rem;
            background: var(--quiz-green);
            color: #fff;
            cursor: pointer;
            font: inherit;
            font-weight: 800;
            transition: background 150ms ease, transform 150ms ease;
        }

        .quiz-submit:hover,
        .quiz-submit:focus-visible,
        .quiz-restart:hover,
        .quiz-restart:focus-visible {
            background: var(--quiz-green-light);
            transform: translateY(-1px);
        }

        .quiz-result {
            padding: 2.2rem 1.4rem 2.5rem;
            text-align: center;
        }

        .quiz-result[hidden] {
            display: none;
        }

        .quiz-result h2 {
            margin: 0 0 0.75rem;
            color: var(--quiz-green);
            font-size: 2rem;
        }

        .quiz-score {
            margin: 0 0 1rem;
            color: var(--quiz-green-light);
            font-size: 3.4rem;
            font-weight: 900;
            line-height: 1;
        }

        .quiz-result p {
            max-width: 520px;
            margin: 0 auto 1.5rem;
            color: var(--quiz-muted);
            line-height: 1.7;
        }

        .quiz-q9-note {
            margin: -0.55rem 0 1rem;
            color: var(--quiz-muted);
            font-size: 0.9rem;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        @media (max-width: 560px) {
            .quiz-shell {
                width: min(100% - 20px, 760px);
                padding-top: 0.75rem;
            }

            .quiz-topbar {
                margin-bottom: 1.25rem;
            }

            .quiz-brand img {
                width: 112px;
                height: 64px;
            }

            .quiz-question-panel,
            .quiz-result {
                padding-inline: 1rem;
            }

            .quiz-actions {
                align-items: flex-end;
                flex-direction: column-reverse;
            }

            .quiz-submit {
                width: 100%;
            }
        }
    </style>
</head>
<body class="safety-quiz-page">
    <main class="quiz-shell">
        <div class="quiz-topbar">
            <a class="quiz-brand" href="index.html" aria-label="Climbing Cyprus">
                <img src="pics/climbing-cyprus-logo.webp" alt="Climbing Cyprus">
            </a>
            <div class="quiz-language" aria-label="בחירת שפה">
                <a href="?lang=he" data-lang-link="he">עברית</a>
                <a href="?lang=en" data-lang-link="en">English</a>
            </div>
            <a class="quiz-back-link" href="climber-guide.html" id="quiz-back-link">חזרה למדריך</a>
        </div>

        <header class="quiz-hero">
            <h1 id="quiz-title"></h1>
            <p id="quiz-intro"></p>
        </header>

        <section class="quiz-card" aria-live="polite">
            <div id="quiz-app"></div>
            <div id="quiz-result" class="quiz-result" hidden></div>
        </section>
    </main>

    <script>
        const lang = new URLSearchParams(window.location.search).get('lang') === 'en' ? 'en' : 'he';
        document.documentElement.lang = lang;
        document.documentElement.dir = lang === 'he' ? 'rtl' : 'ltr';

        const copy = {
            he: {
                title: 'עד כמה אתה מרגיש בטוח להקליפ?',
                intro: '9 שאלות קצרות על בטיחות בהובלה. בחרו תשובה אחת, שלחו — ועוברים מיד לשאלה הבאה.',
                back: 'חזרה למדריך',
                question: (number, total) => `שאלה ${number} מתוך ${total}`,
                options: 'אפשרויות תשובה',
                submit: 'שלח תשובה',
                error: 'בחרו תשובה כדי להמשיך.',
                finished: 'הבוחן הסתיים',
                retry: 'נסו שוב',
                note: 'התבוננו בתמונה לפני שבוחרים תשובה.',
                resultExcellent: 'יש לך בסיס מצוין. ממשיכים לתרגל, שומרים על תקשורת ובודקים כל מערכת לפני שמעמיסים עליה.',
                resultGood: 'יש לך בסיס טוב, וכדאי לרענן כמה נקודות לפני יום הובלה נוסף.',
                resultReview: 'כדאי לעצור לרענון מודרך של היסודות לפני שמתקדמים להובלה עצמאית.'
            },
            en: {
                title: 'How confident do you feel clipping?',
                intro: '9 short lead-climbing safety questions. Choose one answer, submit, and move straight to the next question.',
                back: 'Back to the guide',
                question: (number, total) => `Question ${number} of ${total}`,
                options: 'Answer options',
                submit: 'Submit answer',
                error: 'Choose an answer to continue.',
                finished: 'Quiz complete',
                retry: 'Try again',
                note: 'Look at the image before choosing an answer.',
                resultExcellent: 'You have excellent foundations. Keep practicing, communicate clearly, and check every system before loading it.',
                resultGood: 'You have a good foundation. Review a few points before your next lead-climbing day.',
                resultReview: 'Refresh the fundamentals with an instructor before moving on to independent lead climbing.'
            }
        };

        const questions = [
            {
                image: 'pics/safety-quiz-q1.webp', imageAlt: { he: 'מטפס ומערכת חבל על קיר טיפוס', en: 'Climber and rope system on an indoor climbing wall' },
                text: { he: 'מה בודקים בשיחת בטיחות לפני שמתחילים לטפס?', en: 'What should you check in a safety check before starting to climb?' },
                options: { he: ['רק שהחבל בצבע שמתאים לציוד', 'רתמה, קשר, מכשיר אבטחה, כיוון החבל והקצה החופשי', 'שהמטפס הראשון יעלה לפני שהמאבטח מוכן', 'רק שהקסדה יושבת נוח'], en: ['Only that the rope color matches the gear', 'Harness, knot, belay device, rope direction, and the free end', 'That the first climber starts before the belayer is ready', 'Only that the helmet feels comfortable'] }, answer: 1
            },
            {
                image: 'pics/safety-quiz-q2.webp', imageAlt: { he: 'קוויק-דרו מונח על שפת סלע', en: 'Quickdraw resting on a rock edge' },
                text: { he: 'הקרבינר התחתון נשען על שפת סלע. מה הבחירה הטובה יותר?', en: 'The lower carabiner is resting on a rock edge. What is the better choice?' },
                options: { he: ['להשאיר אותו כך', 'להשתמש בקוויק-דרו ארוך יותר', 'לקליפ את החבל גבוה יותר', 'לסובב את החבל'], en: ['Leave it as it is', 'Use a longer quickdraw', 'Clip the rope higher', 'Twist the rope'] }, answer: 1
            },
            {
                image: 'pics/safety-quiz-q3.webp', imageAlt: { he: 'קוויק-דרו שחוק תלוי על קיר סלע', en: 'Worn quickdraw hanging from a bolt on a rock wall' },
                text: { he: 'הקוויק-דרו הזה שחוק ותלוי על הקיר. האם תטפס מעליו?', en: 'This quickdraw is worn and hanging on the wall. Would you climb above it?' },
                options: { he: ['כן', 'לא'], en: ['Yes', 'No'] }, answer: 1
            },
            {
                image: 'pics/safety-quiz-q4.webp', imageAlt: { he: 'קרבינר טיפוס ורצועה', en: 'Climbing carabiner and sling' },
                text: { he: 'איך בדרך כלל מזהים את הקרבינר בצד החבל?', en: 'How can you usually identify the rope-side carabiner?' },
                options: { he: ['לרוב יש לו STRING keeper ו/או שער מכופף', 'הוא תמיד הקרבינר העליון', 'הוא תמיד הקרבינר הגדול יותר', 'אין ביניהם הבדל'], en: ['It often has a STRING keeper and/or a bent gate', 'It is always the upper carabiner', 'It is always the larger carabiner', 'There is no difference'] }, answer: 0
            },
            {
                image: 'pics/safety-quiz-q5.webp', imageAlt: { he: 'מטפס מושיט יד לקוויק-דרו גבוה', en: 'Climber reaching high to clip a quickdraw' },
                text: { he: 'מטפס מקליפ גבוה כשהוא לא יציב. מה החיסרון העיקרי?', en: 'A climber is clipping very high while unstable. What is the main drawback?' },
                options: { he: ['אין חיסרון; קליפ גבוה תמיד עדיף', 'זה עלול לדרוש משיכת חבל נוסף ולהגדיל את פוטנציאל הנפילה', 'זה מחזק אוטומטית את הבולט', 'זה מפחית אוטומטית את חיכוך החבל'], en: ['Nothing; high clipping is always better', 'It may require pulling extra rope and increase fall potential', 'It makes the bolt stronger', 'It automatically reduces rope drag'] }, answer: 1
            },
            {
                image: 'pics/safety-quiz-q6.webp', imageAlt: { he: 'חבל שעובר בצורה לא נכונה דרך קוויק-דרו', en: 'Climbing rope clipped incorrectly through a quickdraw' },
                text: { he: 'מה הבעיה בתמונה?', en: 'What is the problem in this picture?' },
                options: { he: ['אין בעיה', 'Back-clipping', 'Z-clipping', 'הקוויק-דרו קצר מדי'], en: ['Nothing is wrong', 'Back-clipping', 'Z-clipping', 'The quickdraw is too short'] }, answer: 1
            },
            {
                image: 'pics/safety-quiz-q7.webp', imageAlt: { he: 'מטפס לצד קוויק-דרו וחבל על קיר סלע', en: 'Climber beside a quickdraw and rope on a rock wall' },
                text: { he: 'למה Back-clipping עלול להיות מסוכן?', en: 'Why can back-clipping be dangerous?' },
                options: { he: ['החבל עלול לעבור מעל השער ולפתוח אותו בנפילה', 'הבולט עלול להשתחרר', 'הרצועה נהיית ארוכה מדי', 'המאבטח מאבד שליטה אוטומטית'], en: ['The rope may run over the gate and open it in a fall', 'The bolt may unscrew', 'The sling becomes too long', 'The belayer automatically loses control'] }, answer: 0
            },
            {
                image: 'pics/safety-quiz-q8.webp', imageAlt: { he: 'מטפס מדגים מסלול חבל בין קוויק-דרואים', en: 'Climber demonstrating a rope path between quickdraws' },
                text: { he: 'מה בדרך כלל יוצר Z-clip?', en: 'What usually creates a Z-clip?' },
                options: { he: ['לקיחת חבל מתחת לקוויק-דרו הקודם', 'קליפ נמוך מדי', 'שימוש בקרבינר Wiregate', 'שימוש ברצועה ארוכה'], en: ['Taking rope from below the previous quickdraw', 'Clipping too low', 'Using a wiregate', 'Using a long sling'] }, answer: 0
            },
            {
                image: 'pics/safety-quiz-q9.webp', imageAlt: { he: 'מטפס על מצוק עם קוויק-דרו וחבל', en: 'Climber on a rock face with a quickdraw and rope' },
                text: { he: 'מה חייבים לוודא לפני שממשיכים לטפס אחרי הקליפ שבתמונה?', en: 'What must you verify before continuing to climb after the clip shown in the image?' },
                options: { he: ['שהחבל יושב בקרבינר התחתון של הקוויק-דרו, שהשער סגור ושהכיוון נכון', 'שהחבל עובר מאחורי הגב כדי שלא יפריע', 'שהקוויק-דרו תלוי חופשי בלי חבל בתוכו', 'שאפשר להמשיך בלי להביט בציוד עד הבולט הבא'], en: ['The rope is in the lower carabiner, the gate is closed, and the direction is correct', 'The rope runs behind your back so it does not get in the way', 'The quickdraw hangs freely with no rope in it', 'You can continue without checking the gear until the next bolt'] }, answer: 0
            }
        ];

        const quizApp = document.getElementById('quiz-app');
        const result = document.getElementById('quiz-result');
        const ui = copy[lang];
        let current = 0;
        let score = 0;

        document.getElementById('quiz-title').textContent = ui.title;
        document.getElementById('quiz-intro').textContent = ui.intro;
        document.getElementById('quiz-back-link').textContent = ui.back;
        document.querySelectorAll('[data-lang-link]').forEach(link => {
            if (link.dataset.lang === lang) link.setAttribute('aria-current', 'page');
        });

        function renderQuestion() {
            const question = questions[current];
            const progress = ((current + 1) / questions.length) * 100;
            const image = `<img class="quiz-image" src="${question.image}" alt="${question.imageAlt[lang]}" loading="eager">`;
            const note = `<p class="quiz-q9-note">${ui.note}</p>`;
            const options = question.options[lang].map((option, index) => `
                <label class="quiz-option">
                    <input type="radio" name="quiz-answer" value="${index}">
                    <span>${option}</span>
                </label>
            `).join('');

            quizApp.innerHTML = `
                <div class="quiz-progress-wrap">
                    <div class="quiz-progress-line">
                        <span>${ui.question(current + 1, questions.length)}</span>
                        <span>${Math.round(progress)}%</span>
                    </div>
                    <div class="quiz-progress" role="progressbar" aria-valuemin="1" aria-valuemax="${questions.length}" aria-valuenow="${current + 1}">
                        <div class="quiz-progress-bar" style="width: ${progress}%"></div>
                    </div>
                </div>
                <form class="quiz-question-panel" id="quiz-form">
                    ${image}
                    ${note}
                    <h2>${question.text[lang]}</h2>
                    <fieldset class="quiz-options">
                        <legend class="sr-only">${ui.options}</legend>
                        ${options}
                    </fieldset>
                    <div class="quiz-actions">
                        <div class="quiz-error" id="quiz-error" role="alert"></div>
                        <button class="quiz-submit" type="submit">${ui.submit}</button>
                    </div>
                </form>
            `;

            document.getElementById('quiz-form').addEventListener('submit', (event) => {
                event.preventDefault();
                const selected = document.querySelector('input[name="quiz-answer"]:checked');
                const error = document.getElementById('quiz-error');
                if (!selected) {
                    error.textContent = ui.error;
                    return;
                }
                if (Number(selected.value) === question.answer) score += 1;
                current += 1;
                if (current < questions.length) {
                    renderQuestion();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                } else {
                    showResult();
                }
            });
        }

        function showResult() {
            quizApp.hidden = true;
            result.hidden = false;
            const message = score >= 8 ? ui.resultExcellent : score >= 5 ? ui.resultGood : ui.resultReview;
            result.innerHTML = `
                <h2>${ui.finished}</h2>
                <div class="quiz-score">${score}/${questions.length}</div>
                <p>${message}</p>
                <button class="quiz-restart" type="button">${ui.retry}</button>
            `;
            result.querySelector('.quiz-restart').addEventListener('click', () => {
                current = 0;
                score = 0;
                result.hidden = true;
                quizApp.hidden = false;
                renderQuestion();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
        }

        renderQuestion();
    </script>
</body>
</html>
