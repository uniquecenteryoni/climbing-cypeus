<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="בוחן בטיחות קצר למטפסים: קשרים, אבטחה, קליפים וקבלת החלטות על המצוק.">
    <title>עד כמה אתה מרגיש בטוח להקליפ? | Climbing Cyprus</title>
    <link rel="icon" type="image/webp" href="favicon.webp?v=20260819">
    <link rel="stylesheet" href="style.css?v=safety-quiz-1">
    <style>
        :root {
            --quiz-green: #173d2a;
            --quiz-green-light: #2c5f2d;
            --quiz-lime: #b5d87a;
            --quiz-ink: #1e2e25;
            --quiz-muted: #617067;
            --quiz-paper: #f7f8f3;
        }

        body.safety-quiz-page {
            min-height: 100vh;
            margin: 0;
            background: var(--quiz-paper);
            color: var(--quiz-ink);
            font-family: inherit;
        }

        .quiz-shell {
            width: min(760px, calc(100% - 32px));
            margin: 0 auto;
            padding: 1.5rem 0 4rem;
        }

        .quiz-topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .quiz-brand {
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            color: var(--quiz-green);
            font-weight: 800;
            text-decoration: none;
        }

        .quiz-brand img {
            width: 52px;
            height: 52px;
            padding: 0.35rem;
            border-radius: 50%;
            object-fit: contain;
            background: var(--quiz-green);
        }

        .quiz-back-link {
            color: var(--quiz-green-light);
            font-weight: 700;
            text-decoration: none;
        }

        .quiz-hero {
            margin-bottom: 1.75rem;
            text-align: center;
        }

        .quiz-hero h1 {
            margin: 0 0 0.65rem;
            color: var(--quiz-green);
            font-size: clamp(2rem, 6vw, 3.3rem);
            line-height: 1.1;
        }

        .quiz-hero p {
            max-width: 600px;
            margin: 0 auto;
            color: var(--quiz-muted);
            font-size: 1.05rem;
            line-height: 1.7;
        }

        .quiz-card {
            overflow: hidden;
            border: 1px solid #dfe7dc;
            border-radius: 1.25rem;
            background: #fff;
            box-shadow: 0 18px 45px rgba(23, 61, 42, 0.1);
        }

        .quiz-progress-wrap {
            padding: 1.2rem 1.4rem 0;
        }

        .quiz-progress-line {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            margin-bottom: 0.6rem;
            color: var(--quiz-muted);
            font-size: 0.88rem;
            font-weight: 700;
        }

        .quiz-progress {
            height: 8px;
            overflow: hidden;
            border-radius: 999px;
            background: #e9efe5;
        }

        .quiz-progress-bar {
            width: 11.11%;
            height: 100%;
            border-radius: inherit;
            background: var(--quiz-lime);
            transition: width 220ms ease;
        }

        .quiz-question-panel {
            padding: 1.75rem 1.4rem 1.5rem;
        }

        .quiz-question-panel h2 {
            margin: 0 0 1.35rem;
            color: var(--quiz-green);
            font-size: clamp(1.35rem, 4vw, 1.85rem);
            line-height: 1.35;
        }

        .quiz-options {
            display: grid;
            gap: 0.75rem;
            margin: 0;
            padding: 0;
            border: 0;
        }

        .quiz-option {
            position: relative;
            display: flex;
            align-items: flex-start;
            gap: 0.7rem;
            padding: 0.9rem 1rem;
            border: 1px solid #dfe7dc;
            border-radius: 0.75rem;
            background: #fff;
            cursor: pointer;
            line-height: 1.5;
            transition: border-color 150ms ease, background 150ms ease, transform 150ms ease;
        }

        .quiz-option:hover,
        .quiz-option:has(input:focus-visible) {
            border-color: var(--quiz-lime);
            background: #fbfdf8;
        }

        .quiz-option:has(input:checked) {
            border-color: var(--quiz-green-light);
            background: #f1f7ea;
            transform: translateY(-1px);
        }

        .quiz-option input {
            flex: 0 0 auto;
            width: 1.1rem;
            height: 1.1rem;
            margin-top: 0.18rem;
            accent-color: var(--quiz-green-light);
        }

        .quiz-image {
            width: 100%;
            max-height: 430px;
            margin: 0 0 1.25rem;
            border-radius: 0.9rem;
            object-fit: cover;
            object-position: center;
        }

        .quiz-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .quiz-error {
            min-height: 1.4em;
            color: #a34234;
            font-size: 0.9rem;
            font-weight: 700;
        }

        .quiz-submit,
        .quiz-restart {
            border: 0;
            border-radius: 999px;
            padding: 0.85rem 1.35rem;
            background: var(--quiz-green);
            color: #fff;
            cursor: pointer;
            font: inherit;
            font-weight: 800;
            transition: background 150ms ease, transform 150ms ease;
        }

        .quiz-submit:hover,
        .quiz-submit:focus-visible,
        .quiz-restart:hover,
        .quiz-restart:focus-visible {
            background: var(--quiz-green-light);
            transform: translateY(-1px);
        }

        .quiz-result {
            padding: 2.2rem 1.4rem 2.5rem;
            text-align: center;
        }

        .quiz-result[hidden] {
            display: none;
        }

        .quiz-result h2 {
            margin: 0 0 0.75rem;
            color: var(--quiz-green);
            font-size: 2rem;
        }

        .quiz-score {
            margin: 0 0 1rem;
            color: var(--quiz-green-light);
            font-size: 3.4rem;
            font-weight: 900;
            line-height: 1;
        }

        .quiz-result p {
            max-width: 520px;
            margin: 0 auto 1.5rem;
            color: var(--quiz-muted);
            line-height: 1.7;
        }

        .quiz-q9-note {
            margin: -0.55rem 0 1rem;
            color: var(--quiz-muted);
            font-size: 0.9rem;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        @media (max-width: 560px) {
            .quiz-shell {
                width: min(100% - 20px, 760px);
                padding-top: 0.75rem;
            }

            .quiz-topbar {
                margin-bottom: 1.25rem;
            }

            .quiz-brand span {
                max-width: 140px;
                font-size: 0.9rem;
            }

            .quiz-question-panel,
            .quiz-result {
                padding-inline: 1rem;
            }

            .quiz-actions {
                align-items: flex-end;
                flex-direction: column-reverse;
            }

            .quiz-submit {
                width: 100%;
            }
        }
    </style>
</head>
<body class="safety-quiz-page">
    <main class="quiz-shell">
        <div class="quiz-topbar">
            <a class="quiz-brand" href="index.html" aria-label="חזרה לאתר Climbing Cyprus">
                <img src="pics/climbing-cyprus-logo-white.webp" alt="Climbing Cyprus">
                <span>Climbing Cyprus<br>קפריסין בעין אחרת</span>
            </a>
            <a class="quiz-back-link" href="climber-guide.html">חזרה למדריך</a>
        </div>

        <header class="quiz-hero">
            <h1>עד כמה אתה מרגיש בטוח להקליפ?</h1>
            <p>9 שאלות קצרות על בטיחות בהובלה. בחרו תשובה אחת, שלחו — ועוברים מיד לשאלה הבאה.</p>
        </header>

        <section class="quiz-card" aria-live="polite">
            <div id="quiz-app"></div>
            <div id="quiz-result" class="quiz-result" hidden></div>
        </section>
    </main>

    <script>
        const questions = [
            {
                text: 'מה בודקים בשיחת בטיחות לפני שמתחילים לטפס?',
                options: [
                    'רק שהחבל בצבע שמתאים לציוד',
                    'רתמה, קשר, מכשיר אבטחה, כיוון החבל והקצה החופשי',
                    'שהמטפס הראשון יעלה לפני שהמאבטח מוכן',
                    'רק שהקסדה יושבת נוח'
                ],
                answer: 1
            },
            {
                text: 'איך מזהים מצב של Back Clip?',
                options: [
                    'החבל עובר בצד הלא נכון של הקרבינר בקוויק-דרו',
                    'החבל ארוך מדי',
                    'המאבטח עומד קרוב למצוק',
                    'הקוויק-דרו מחובר לבולט'
                ],
                answer: 0
            },
            {
                text: 'מהי פעולת היד הנכונה של המאבטח בזמן אבטחה?',
                options: [
                    'להחזיק את החבל רק בקצות האצבעות',
                    'להשאיר את יד הבלימה מאחורי מכשיר האבטחה ולשמור על שליטה',
                    'להעביר את החבל ליד השנייה בכל פעם שהמטפס זז',
                    'לשחרר את החבל כשהמטפס מתקרב לבולט'
                ],
                answer: 1
            },
            {
                text: 'איבדתם תקשורת קולית בין המטפס למאבטח. מה עושים?',
                options: [
                    'ממשיכים כרגיל ומקווים שהכול ברור',
                    'מושכים בחבל כדי לסמן שהכול בסדר',
                    'עוצרים, קובעים סימנים מוסכמים מחדש ומוודאים ששניכם מבינים אותם',
                    'המטפס מוריד את עצמו מיד בלי לתקשר'
                ],
                answer: 2
            },
            {
                text: 'מה חשוב לבדוק מיד אחרי קליפ?',
                options: [
                    'שהשער של הקרבינר סגור ושהחבל יושב בתוכו בכיוון הנכון',
                    'שהחבל נוגע בסלע',
                    'שהקוויק-דרו מסובב הצידה',
                    'שהחבל עובר בין הרגליים'
                ],
                answer: 0
            },
            {
                text: 'מהי תגובת המאבטח הנכונה כשמטפס מודיע שהוא עומד ליפול?',
                options: [
                    'לרוץ לאחור כדי להתרחק מהמצוק',
                    'לשמור יד בלימה, להיות מוכן לספוג את הנפילה ולהישאר קשוב',
                    'לשחרר חבל כדי שהנפילה תהיה רכה יותר',
                    'להסתכל רק על הבולט הבא'
                ],
                answer: 1
            },
            {
                text: 'לפני שמנקים תחנה או משנים מערכת, מה חייבים לעשות?',
                options: [
                    'לנתק את החבל כדי לעבוד מהר יותר',
                    'לוודא שיש מערכת גיבוי ותכנית ברורה, ולבצע בדיקה הדדית',
                    'לבקש מהמטפס הבא להחליט',
                    'להסתמך על הזיכרון מהאימון הקודם'
                ],
                answer: 1
            },
            {
                text: 'למה חשוב לקשור קשר עצירה בקצה החבל?',
                options: [
                    'כדי שהחבל ייראה מסודר יותר',
                    'כדי למנוע מהקצה לעבור בטעות דרך מכשיר האבטחה',
                    'כדי להקל על הקליפ הראשון',
                    'אין צורך בכך אם החבל חדש'
                ],
                answer: 1
            },
            {
                image: 'pics/safety-quiz-q9.webp',
                imageAlt: 'מטפס על מצוק עם קוויק-דרו וחבל',
                note: 'התבוננו בתמונה לפני שבוחרים תשובה.',
                text: 'מה חייבים לוודא לפני שממשיכים לטפס אחרי הקליפ שבתמונה?',
                options: [
                    'שהחבל יושב בקרבינר התחתון של הקוויק-דרו, שהשער סגור ושהכיוון נכון',
                    'שהחבל עובר מאחורי הגב כדי שלא יפריע',
                    'שהקוויק-דרו תלוי חופשי בלי חבל בתוכו',
                    'שאפשר להמשיך בלי להביט בציוד עד הבולט הבא'
                ],
                answer: 0
            }
        ];

        const quizApp = document.getElementById('quiz-app');
        const result = document.getElementById('quiz-result');
        let current = 0;
        let score = 0;

        function renderQuestion() {
            const question = questions[current];
            const progress = ((current + 1) / questions.length) * 100;
            const image = question.image
                ? `<img class="quiz-image" src="${question.image}" alt="${question.imageAlt}" loading="eager">`
                : '';
            const note = question.note ? `<p class="quiz-q9-note">${question.note}</p>` : '';
            const options = question.options.map((option, index) => `
                <label class="quiz-option">
                    <input type="radio" name="quiz-answer" value="${index}">
                    <span>${option}</span>
                </label>
            `).join('');

            quizApp.innerHTML = `
                <div class="quiz-progress-wrap">
                    <div class="quiz-progress-line">
                        <span>שאלה ${current + 1} מתוך ${questions.length}</span>
                        <span>${Math.round(progress)}%</span>
                    </div>
                    <div class="quiz-progress" role="progressbar" aria-valuemin="1" aria-valuemax="${questions.length}" aria-valuenow="${current + 1}">
                        <div class="quiz-progress-bar" style="width: ${progress}%"></div>
                    </div>
                </div>
                <form class="quiz-question-panel" id="quiz-form">
                    ${image}
                    ${note}
                    <h2>${question.text}</h2>
                    <fieldset class="quiz-options">
                        <legend class="sr-only">אפשרויות תשובה</legend>
                        ${options}
                    </fieldset>
                    <div class="quiz-actions">
                        <div class="quiz-error" id="quiz-error" role="alert"></div>
                        <button class="quiz-submit" type="submit">שלח תשובה</button>
                    </div>
                </form>
            `;

            document.getElementById('quiz-form').addEventListener('submit', (event) => {
                event.preventDefault();
                const selected = document.querySelector('input[name="quiz-answer"]:checked');
                const error = document.getElementById('quiz-error');
                if (!selected) {
                    error.textContent = 'בחרו תשובה כדי להמשיך.';
                    return;
                }
                if (Number(selected.value) === question.answer) score += 1;
                current += 1;
                if (current < questions.length) {
                    renderQuestion();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                } else {
                    showResult();
                }
            });
        }

        function showResult() {
            quizApp.hidden = true;
            result.hidden = false;
            const message = score >= 8
                ? 'יש לך בסיס מצוין. ממשיכים לתרגל, שומרים על תקשורת ובודקים כל מערכת לפני שמעמיסים עליה.'
                : score >= 5
                    ? 'יש לך בסיס טוב, וכדאי לרענן כמה נקודות לפני יום הובלה נוסף.'
                    : 'כדאי לעצור לרענון מודרך של היסודות לפני שמתקדמים להובלה עצמאית.';
            result.innerHTML = `
                <h2>הבוחן הסתיים</h2>
                <div class="quiz-score">${score}/${questions.length}</div>
                <p>${message}</p>
                <button class="quiz-restart" type="button">נסו שוב</button>
            `;
            result.querySelector('.quiz-restart').addEventListener('click', () => {
                current = 0;
                score = 0;
                result.hidden = true;
                quizApp.hidden = false;
                renderQuestion();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
        }

        renderQuestion();
    </script>
</body>
</html>
