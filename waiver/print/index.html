<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>פתיחת אישור להדפסה</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            color: #173f35;
            background: #f4f0e7;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        main {
            max-width: 560px;
            padding: 34px;
            background: white;
            border-radius: 14px;
            box-shadow: 0 18px 55px rgba(20, 49, 41, .12);
        }

        .spinner {
            width: 42px;
            height: 42px;
            margin: 0 auto 20px;
            border: 4px solid #dce6df;
            border-top-color: #ed7332;
            border-radius: 50%;
            animation: spin .8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        a {
            color: #173f35;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <main>
        <div class="spinner" aria-hidden="true"></div>
        <h1>פותח את האישור המלא…</h1>
        <p>Opening the complete printable waiver…</p>
    </main>
    <script>
        (async function () {
            function base64ToBytes(value) {
                const normalized = value.replaceAll("-", "+").replaceAll("_", "/");
                const padded = normalized + "=".repeat((4 - normalized.length % 4) % 4);
                const binary = atob(padded);
                return Uint8Array.from(binary, character => character.charCodeAt(0));
            }

            try {
                const payload = window.location.hash.slice(1);
                if (!payload) throw new Error("Missing waiver data");

                const separator = payload.indexOf(".");
                const format = payload.slice(0, separator);
                let bytes = base64ToBytes(payload.slice(separator + 1));

                if (format === "gz") {
                    if (!("DecompressionStream" in window)) {
                        throw new Error("This browser cannot open the compressed waiver");
                    }
                    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
                    bytes = new Uint8Array(await new Response(stream).arrayBuffer());
                } else if (format !== "b64") {
                    throw new Error("Unknown waiver format");
                }

                const html = new TextDecoder().decode(bytes);
                document.open();
                document.write(html);
                document.close();
            } catch (error) {
                document.querySelector("main").innerHTML = `
                    <h1>לא ניתן לפתוח את האישור</h1>
                    <p>הקישור חסר או אינו שלם. יש להעתיק מהמייל את הקישור כולו ולנסות שוב.</p>
                    <h2>Unable to open the waiver</h2>
                    <p>The link is missing or incomplete. Copy the entire link from the email and try again.</p>
                    <a href="../">חזרה לטופס / Back to waiver</a>`;
            }
        })();
    </script>
</body>
</html>
